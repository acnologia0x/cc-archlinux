music_directory "/home/cc/Music/cc"
playlist_directory "/home/cc/Music/mpd/playlists"
port "6600"
restore_paused "yes"
metadata_to_use	"artist,album,title,track,name,date,composer,performer,disc"
auto_update "yes"

audio_output {
    type        "pipewire"
    name        "CC PipeWire Sound Server"
}

audio_output {
    type "fifo"
    name "cava"
    path "/tmp/mpd.fifo"
    format "44100:16:2"
}